name: Docker images

# Builds the client / proxy / nginx targets of the root Dockerfile and pushes them to GHCR as
#   ghcr.io/<owner>/<repo>-client | -proxy | -nginx
# The Dockerfile clones this repository itself, at the ref that triggered the run (branch or tag),
# so the images always match the pushed source.
#
# On a push only the targets whose folders changed are rebuilt (dorny/paths-filter in the `changes`
# job); tags and manual runs always build all four. An image that is skipped keeps its previous
# :latest / :<branch> tag, which still matches its own sources.

on:
  push:
    branches: [main, mac-fixes]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Anything that changes how every image is built.
            common: &common
              - Dockerfile
              - .github/workflows/docker-images.yml
              - global.json
            client:
              - *common
              - source/cuo/**
              - source/vendor/**
              - source/webclient/minimal-www/**
              - source/webclient/shared-www/**
              - source/webclient/native-shims/**
              - source/webclient/wasm-fna-native*.targets
              - source/webclient/classicuo-wasm/**
              - server/scripts/**
            client-tuo:
              - *common
              - source/tuo/**
              # build.sh checks the FileEmbed submodule under source/cuo for both clients
              - source/cuo/external/**
              - source/vendor/**
              - source/webclient/minimal-www/**
              - source/webclient/shared-www/**
              - source/webclient/native-shims/**
              - source/webclient/wasm-fna-native*.targets
              - source/webclient/tazuo-wasm/**
              - server/scripts/**
            proxy:
              - *common
              - server/src/**
              - server/scripts/**
              - server/package*.json
              - server/tsconfig.json
            nginx:
              - *common
              - server/deploy/**

      # Tags and manual runs build everything; a push builds only what the filter flagged.
      - id: matrix
        env:
          FORCE_ALL: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') }}
          CLIENT: ${{ steps.filter.outputs.client }}
          CLIENT_TUO: ${{ steps.filter.outputs.client-tuo }}
          PROXY: ${{ steps.filter.outputs.proxy }}
          NGINX: ${{ steps.filter.outputs.nginx }}
        run: |
          targets=()
          [ "$FORCE_ALL" = true ] || [ "$CLIENT" = true ]     && targets+=(client)
          [ "$FORCE_ALL" = true ] || [ "$CLIENT_TUO" = true ] && targets+=(client-tuo)
          [ "$FORCE_ALL" = true ] || [ "$PROXY" = true ]      && targets+=(proxy)
          [ "$FORCE_ALL" = true ] || [ "$NGINX" = true ]      && targets+=(nginx)
          json=$(printf '%s\n' "${targets[@]}" | jq -R . | jq -sc 'map(select(length>0))')
          echo "matrix=$json" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    # Per target rather than per workflow: with path filtering, a later push that only touches nginx
    # must not cancel the still-running client build of the previous push, because nothing would
    # rebuild the client afterwards.
    concurrency:
      group: docker-images-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.target }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UONEXUS_REPO=${{ github.server_url }}/${{ github.repository }}.git
            UONEXUS_REF=${{ github.ref_name }}
            UONEXUS_REV=${{ github.sha }}
          # A branch name never changes, so UONEXUS_REV (the commit) is what busts the cache of the
          # git clone layer; the client compile after it is the 10+ minute step.
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
